<nav class="menu">
    <ul class="menu__inner">
        {{ range .Site.Menus.main }}
            {{ if .HasChildren }}
                <div class="submenu">
                    <li class="dropdown">
                    <a href="javascript:void(0)" class="dropbtn">{{ .Name }}</a>
                    <div class="dropdown-content">
                    {{ range .Children }}
                        <a href="{{ .URL }}">{{ .Name }}</a>
                    {{ end }}
                    </div>
                    </li>
                </div>
            {{ else }}
                <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
            {{ end }}
        {{ end }}

        {{ if hugo.IsMultilingual }}
            {{ range $.Sites }}
                <li><a href="{{ .Home.RelPermalink }}">{{ .Language.LanguageName }}</a></li>
            {{ end }}
        {{ end }}
    </ul>
</nav>
