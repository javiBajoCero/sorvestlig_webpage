{{ define "body" }}
  <body class="{{ if .Site.Params.backgroundImage }}background-image" style="background-image: url('{{ .Site.Params.backgroundImage }}');" {{ else }}"{{ end }}>
{{ end }}

{{ define "main" }}
  <main class="post">
    {{ if .Content }}
      <div class="post-content index-content">
        {{ .Content }}
      </div>
    {{ else }}
      <div class="post-content index-content">
        {{ if .Site.Params.Portrait.Path }}
          <img src="{{ .Site.Params.Portrait.Path }}" class="circle" alt="{{ .Site.Params.Portrait.Alt }}" style="max-width:{{ .Site.Params.Portrait.MaxWidth }}" />
        {{ end }}

        <h1>{{ .Site.Title }}</h1>

        {{ partial "subtitle.html" . }}

        {{ with .Site.Params.social }}
          <div>
            {{ partial "social-icons.html" . }}
          </div>

      <div class="index-showcase" aria-label="Sørvestlig working surfaces">
        <figure class="index-showcase__figure index-showcase__figure--portrait">
          <img src="{{ "images/franpereaquienlolea.jpg" | relURL }}" alt="Firmware and hardware testing at a workbench" />
        </figure>
        <figure class="index-showcase__figure index-showcase__figure--landscape">
          <img src="{{ "images/probescircuit.jpg" | relURL }}" alt="Oscilloscope probes connected to a circuit board" />
        </figure>
      </div>
        {{ end }}
      </div>
    {{ end }}
  </main>
{{ end }}
