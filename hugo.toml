baseURL = "https://www.sorvestlig.com/"
languageCode = "en-us"
title = "sørvestlig"

theme = "hugo-theme-hello-friend-ng"

[pagination]
pagerSize = 5

[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 10

[[menu.main]]
identifier = "projects"
name = "Projects"
url = "/projects/"
weight = 20

[[menu.main]]
identifier = "team"
name = "Team"
url = "/team/"
weight = 30

[[menu.main]]
identifier = "careers"
name = "Careers"
url = "/careers/"
weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  disableHugoGeneratorInject = true

  # This forces the homepage list to show projects instead of careers
  mainSections = ["projects"]
