baseURL = "https://www.sorvestlig.com/"
languageCode = "en-us"
title = "sørvestlig"

theme = "hugo-theme-hello-friend-ng"
defaultContentLanguage = "en"

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 1
    title = "sørvestlig"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'

  [languages.en.params]
    [languages.en.params.Logo]
      logoText = "sørvestlig"
      LogoHomeLink = "/"
      logoCursorColor = "#b87333"

  [[languages.en.menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 10

  [[languages.en.menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 20

  [[languages.en.menu.main]]
  identifier = "team"
  name = "Team"
  url = "/team/"
  weight = 30

  [[languages.en.menu.main]]
  identifier = "careers"
  name = "Careers"
  url = "/careers/"
  weight = 40

  [languages.es]
    languageName = "Español"
    languageCode = "es"
    weight = 2
    title = "sørvestlig"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'

  [languages.es.params]
    [languages.es.params.Logo]
      logoText = "sørvestlig"
      LogoHomeLink = "/"
      logoCursorColor = "#b87333"

  [[languages.es.menu.main]]
  identifier = "home"
  name = "Inicio"
  url = "/"
  weight = 10

  [[languages.es.menu.main]]
  identifier = "projects"
  name = "Proyectos"
  url = "/projects/"
  weight = 20

  [[languages.es.menu.main]]
  identifier = "team"
  name = "Equipo"
  url = "/team/"
  weight = 30

  [[languages.es.menu.main]]
  identifier = "careers"
  name = "Carreras"
  url = "/careers/"
  weight = 40

  [languages.no]
    languageName = "Norsk Bokmål"
    languageCode = "no"
    weight = 3
    title = "sørvestlig"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'

  [languages.no.params]
    [languages.no.params.Logo]
      logoText = "sørvestlig"
      LogoHomeLink = "/"
      logoCursorColor = "#b87333"

  [[languages.no.menu.main]]
  identifier = "home"
  name = "Hjem"
  url = "/"
  weight = 10

  [[languages.no.menu.main]]
  identifier = "projects"
  name = "Prosjekter"
  url = "/projects/"
  weight = 20

  [[languages.no.menu.main]]
  identifier = "team"
  name = "Team"
  url = "/team/"
  weight = 30

  [[languages.no.menu.main]]
  identifier = "careers"
  name = "Karriere"
  url = "/careers/"
  weight = 40

[pagination]
pagerSize = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  defaultTheme = "auto"
  EnableGlobalLanguageMenu = false
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  disableHugoGeneratorInject = true
  customCSS = ["/css/extended/custom.css"]

  [params.Logo]
    logoText = "sørvestlig"
    LogoHomeLink = "/"
    logoCursorColor = "#b87333"

  # This forces the homepage list to show projects instead of careers
  mainSections = ["projects"]
